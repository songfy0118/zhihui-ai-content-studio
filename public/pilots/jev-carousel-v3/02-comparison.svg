
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
  <title>聊天模型 vs 决策模型</title>
  <defs>
    <pattern id="paper-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1f2937" stroke-opacity=".025"/>
    </pattern>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#111827" flood-opacity=".08"/>
    </filter>
    <style>
      .sans{font-family:"Microsoft YaHei","Noto Sans SC",Arial,sans-serif;fill:#161b22}
      .serif{font-family:"SimSun","Noto Serif SC",serif;fill:#161b22}
      .mono{font-family:Consolas,"SFMono-Regular",monospace}
      .section{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:21px;font-weight:800;letter-spacing:1.2px;fill:#2457c5}
      .headline{font-family:"SimSun","Noto Serif SC",serif;font-size:57px;font-weight:900;fill:#161b22}
      .deck{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:25px;font-weight:600;fill:#53606c}
      .h2{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:29px;font-weight:900;fill:#161b22}
      .h3{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:23px;font-weight:800;fill:#161b22}
      .body{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:22px;fill:#161b22}
      .small{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:18px;fill:#53606c}
      .tiny{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:15px;fill:#53606c}
      .source{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:14px;fill:#707983}
      .pill{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:17px;font-weight:800}
      .note{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:18px;font-weight:700}
    </style>
  </defs>
  <rect width="1080" height="1440" fill="#f7f5ef"/>
  <rect width="1080" height="1440" fill="url(#paper-grid)"/>
  <rect x="0" y="0" width="18" height="1440" fill="#2457c5"/>
  <text x="72" y="72" class="section" >01 · MODEL DIVISION</text>
  <text x="1008" y="72" class="tiny" text-anchor="end">FIELD NOTE  ·  02/07</text>
  <path d="M72 96H1008" stroke="#2457c5" stroke-width="3" />
  <text x="72" y="165" class="headline" >聊天模型 vs 决策模型</text>
  <text x="72" y="217" class="deck" >差别不是“谁更聪明”，而是输出空间、失败方式和使用位置完全不同</text>
  <path d="M72 1278H1008" stroke="#b7bcc2" stroke-width="1" />
  <text x="1008" y="1325" class="source" text-anchor="end">JEV / SYSTEM ONE · RESEARCH EXPLAINER</text>
  
        <g transform="translate(72 286)" filter="url(#soft-shadow)">
          <rect width="936" height="690" rx="16" fill="#ffffff" stroke="#161b22" stroke-width="2"/>
          <rect width="936" height="70" rx="16" fill="#161b22"/>
          <text x="28" y="45" class="h3" style="fill:#ffffff">比较维度</text>
          <text x="320" y="45" class="h3" style="fill:#ffffff">通用聊天模型</text>
          <text x="648" y="45" class="h3" style="fill:#ffffff">Jev / 决策模型</text>
          <path d="M292 70H292" stroke="#b7bcc2" stroke-width="1" />
          <path d="M620 70H620" stroke="#b7bcc2" stroke-width="1" />
          <path d="M0 168H936" stroke="#b7bcc2" stroke-width="1" /><path d="M0 266H936" stroke="#b7bcc2" stroke-width="1" /><path d="M0 364H936" stroke="#b7bcc2" stroke-width="1" /><path d="M0 462H936" stroke="#b7bcc2" stroke-width="1" /><path d="M0 560H936" stroke="#b7bcc2" stroke-width="1" /><path d="M0 658H936" stroke="#b7bcc2" stroke-width="1" />
          <text x="28" y="128" class="h3" >核心输出</text>
          <text x="320" y="113" class="body" >自然语言 / 代码</text><text x="320" y="145" class="small" >答案空间开放</text>
          <text x="648" y="113" class="body" >Choice / Score / Noul</text><text x="648" y="145" class="small" >答案空间预先定义</text>
          <text x="28" y="226" class="h3" >擅长任务</text>
          <text x="320" y="211" class="body" >解释、推理、创作</text><text x="320" y="243" class="small" >规划复杂步骤</text>
          <text x="648" y="211" class="body" >路由、分类、评分</text><text x="648" y="243" class="small" >门控与是否升级</text>
          <text x="28" y="324" class="h3" >典型失败</text>
          <text x="320" y="309" class="body" >说得合理但事实错</text><text x="320" y="341" class="small" >格式可能漂移</text>
          <text x="648" y="309" class="body" >格式正确但判断错</text><text x="648" y="341" class="small" >置信度不等于正确率</text>
          <text x="28" y="422" class="h3" >工程处理</text>
          <text x="320" y="407" class="body" >解析、验证、重试</text><text x="320" y="439" class="small" >保留引用和证据</text>
          <text x="648" y="407" class="body" >阈值、校准、兜底</text><text x="648" y="439" class="small" >低信心转人或推理模型</text>
          <text x="28" y="520" class="h3" >适合位置</text>
          <text x="320" y="505" class="body" >前端理解与内容生成</text><text x="320" y="537" class="small" >复杂问题的慢思考</text>
          <text x="648" y="505" class="body" >工作流中间的窄判断</text><text x="648" y="537" class="small" >大量重复的小决策</text>
          <text x="28" y="618" class="h3" >一句话</text>
          <text x="320" y="618" class="body" style="fill:#2457c5" font-weight="800">把问题讲明白</text>
          <text x="648" y="618" class="body" style="fill:#d4552d" font-weight="800">把下一步选出来</text>
        </g>
        
  <rect x="72" y="1014" width="936" height="54" rx="8" fill="#e9effc"/>
  <rect x="72" y="1014" width="6" height="54" rx="3" fill="#2457c5"/>
  <text x="94" y="1049" class="note" style="fill:#2457c5">适合分工，不代表固定搭配；具体模型选择仍取决于任务、数据与风险。</text>

        <text x="72" y="1112" class="h2" >读图方法</text>
        <text x="72" y="1154" class="body" >不要问“谁替代谁”，先问：这个步骤需要自由表达，还是有限选项里的可靠判断？</text>
        <text x="72" y="1200" class="body" >只有后者，才是 Jev 这类决策模型的主战场。</text>
        <text x="72" y="1325" class="source" >资料：[1] TypeSafe AI Architecture / SDK；[2] Jev FAQ。</text>
      
</svg>