
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
  <title>真正的产品，是可回滚的决策链</title>
  <defs>
    <pattern id="paper-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1f2937" stroke-opacity=".025"/>
    </pattern>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#111827" flood-opacity=".08"/>
    </filter>
    <style>
      .sans{font-family:"Microsoft YaHei","Noto Sans SC",Arial,sans-serif;fill:#161b22}
      .serif{font-family:"SimSun","Noto Serif SC",serif;fill:#161b22}
      .mono{font-family:Consolas,"SFMono-Regular",monospace}
      .section{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:21px;font-weight:800;letter-spacing:1.2px;fill:#2457c5}
      .headline{font-family:"SimSun","Noto Serif SC",serif;font-size:57px;font-weight:900;fill:#161b22}
      .deck{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:25px;font-weight:600;fill:#53606c}
      .h2{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:29px;font-weight:900;fill:#161b22}
      .h3{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:23px;font-weight:800;fill:#161b22}
      .body{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:22px;fill:#161b22}
      .small{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:18px;fill:#53606c}
      .tiny{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:15px;fill:#53606c}
      .source{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:14px;fill:#707983}
      .pill{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:17px;font-weight:800}
      .note{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:18px;font-weight:700}
    </style>
  </defs>
  <rect width="1080" height="1440" fill="#f7f5ef"/>
  <rect width="1080" height="1440" fill="url(#paper-grid)"/>
  <rect x="0" y="0" width="18" height="1440" fill="#2457c5"/>
  <text x="72" y="72" class="section" >03 · CONTROL LOOP</text>
  <text x="1008" y="72" class="tiny" text-anchor="end">FIELD NOTE  ·  04/07</text>
  <path d="M72 96H1008" stroke="#2457c5" stroke-width="3" />
  <text x="72" y="165" class="headline" >真正的产品，是可回滚的决策链</text>
  <text x="72" y="217" class="deck" >输入、判断、阈值、执行、反馈缺一不可；模型只是其中一个盒子</text>
  <path d="M72 1278H1008" stroke="#b7bcc2" stroke-width="1" />
  <text x="1008" y="1325" class="source" text-anchor="end">JEV / SYSTEM ONE · RESEARCH EXPLAINER</text>
  
        <g transform="translate(72 292)" filter="url(#soft-shadow)">
          <rect width="936" height="500" rx="16" fill="#ffffff" stroke="#161b22" stroke-width="2"/>
          <text x="28" y="48" class="h3" >AGENT DECISION CONTROL PLANE</text>
          <text x="774" y="48" class="small" style="fill:#d4552d">可审计 / 可暂停 / 可回滚</text>
          <g transform="translate(28 102)">
            <rect width="150" height="98" rx="10" fill="#e8ebee"/><text x="75" y="41" class="h3" text-anchor="middle">STATE</text><text x="75" y="72" class="small" text-anchor="middle">上下文与证据</text>
            <path d="M164 49h54" stroke="#161b22" stroke-width="3"/><path d="M204 38l15 11-15 11" fill="none" stroke="#161b22" stroke-width="3"/>
            <rect x="232" width="150" height="98" rx="10" fill="#faeae3" stroke="#d4552d" stroke-width="2"/><text x="307" y="41" class="h3" style="fill:#d4552d" text-anchor="middle">JEV</text><text x="307" y="72" class="small" text-anchor="middle">结构化判断</text>
            <path d="M396 49h54" stroke="#161b22" stroke-width="3"/><path d="M436 38l15 11-15 11" fill="none" stroke="#161b22" stroke-width="3"/>
            <rect x="464" width="150" height="98" rx="10" fill="#e9effc" stroke="#2457c5" stroke-width="2"/><text x="539" y="41" class="h3" style="fill:#2457c5" text-anchor="middle">POLICY</text><text x="539" y="72" class="small" text-anchor="middle">阈值与权限</text>
            <path d="M628 49h54" stroke="#161b22" stroke-width="3"/><path d="M668 38l15 11-15 11" fill="none" stroke="#161b22" stroke-width="3"/>
            <rect x="696" width="184" height="98" rx="10" fill="#161b22"/><text x="788" y="41" class="h3" style="fill:#ffffff" text-anchor="middle">ACTION</text><text x="788" y="72" class="small" style="fill:#d1d5db" text-anchor="middle">执行 / 确认 / 转人</text>
            <path d="M788 112v70H75v-58" fill="none" stroke="#d4552d" stroke-width="3" stroke-dasharray="9 8"/>
            <text x="430" y="211" class="small" style="fill:#d4552d" text-anchor="middle">真实结果回流：是否点开？判断是否正确？人工有没有改？</text>
          </g>
          <path d="M28 366H908" stroke="#b7bcc2" stroke-width="2" />
          <text x="28" y="406" class="h3" >三段式安全门</text>
          
  <rect x="28" y="428" width="245" height="42" rx="21" fill="#2457c5"/>
  <text x="150.5" y="457" class="pill" style="fill:#ffffff" text-anchor="middle">&gt; 0.90  自动执行</text>

          
  <rect x="286" y="428" width="286" height="42" rx="21" fill="#d4552d"/>
  <text x="429" y="457" class="pill" style="fill:#ffffff" text-anchor="middle">0.50–0.90  请求确认</text>

          
  <rect x="585" y="428" width="323" height="42" rx="21" fill="#161b22"/>
  <text x="746.5" y="457" class="pill" style="fill:#ffffff" text-anchor="middle">&lt; 0.50  转人工/推理模型</text>

        </g>
        <g transform="translate(72 836)">
          <text x="0" y="34" class="h2" >为什么这比“调一个模型”难？</text>
          <rect y="60" width="936" height="312" rx="14" fill="#ffffff" stroke="#b7bcc2"/>
          <text x="26" y="106" class="h3" style="fill:#2457c5">01  问题定义</text><text x="218" y="106" class="body" >选项边界、量表描述和反例写得不好，输出也会系统性偏移。</text>
          <text x="26" y="169" class="h3" style="fill:#d4552d">02  阈值校准</text><text x="218" y="169" class="body" >别照抄 0.9；必须用自己的标注数据找误报/漏报平衡点。</text>
          <text x="26" y="232" class="h3" >03  权限控制</text><text x="218" y="232" class="body" >读信息、写草稿、公开发布，对置信度和人工确认要求不应相同。</text>
          <text x="26" y="295" class="h3" >04  结果回流</text><text x="218" y="295" class="body" >没有真实结果，就无法知道模型是否越来越适合你的工作流。</text>
          <text x="26" y="348" class="small" >失败必须可诊断：保留输入、输出、阈值、操作人和最终结果。</text>
        </g>
        <text x="72" y="1325" class="source" >阈值区间为 TypeSafe 指南示例，不是所有业务通用标准；高风险动作应更保守。</text>
      
</svg>