
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
  <title>官方说快 194 倍， 这个数字先别急着信</title>
  <defs>
    <pattern id="paper-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1f2937" stroke-opacity=".025"/>
    </pattern>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#111827" flood-opacity=".08"/>
    </filter>
    <style>
      .sans{font-family:"Microsoft YaHei","Noto Sans SC",Arial,sans-serif;fill:#161b22}
      .serif{font-family:"SimSun","Noto Serif SC",serif;fill:#161b22}
      .mono{font-family:Consolas,"SFMono-Regular",monospace}
      .section{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:21px;font-weight:800;letter-spacing:1.2px;fill:#d4552d}
      .headline{font-family:"SimSun","Noto Serif SC",serif;font-size:57px;font-weight:900;fill:#161b22}
      .headlineSplit{font-family:"SimSun","Noto Serif SC",serif;font-size:44px;font-weight:900;fill:#161b22}
      .deck{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:25px;font-weight:600;fill:#53606c}
      .h2{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:29px;font-weight:900;fill:#161b22}
      .h3{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:23px;font-weight:800;fill:#161b22}
      .body{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:22px;fill:#161b22}
      .small{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:18px;fill:#53606c}
      .tiny{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:15px;fill:#53606c}
      .source{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:14px;fill:#707983}
      .pill{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:17px;font-weight:800}
      .note{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:18px;font-weight:700}
    </style>
  </defs>
  <rect width="1080" height="1440" fill="#f7f5ef"/>
  <rect width="1080" height="1440" fill="url(#paper-grid)"/>
  <rect x="0" y="0" width="18" height="1440" fill="#d4552d"/>
  <text x="72" y="72" class="section" >04 · EVIDENCE LADDER</text>
  <text x="1008" y="72" class="tiny" text-anchor="end">FIELD NOTE  ·  05/07</text>
  <path d="M72 96H1008" stroke="#d4552d" stroke-width="3" />
  <text x="72" y="151" class="headlineSplit" >官方说快 194 倍，</text><text x="72" y="203" class="headlineSplit" >这个数字先别急着信</text>
  <text x="72" y="248" class="deck" >厂商基准、第三方小样本和生产数据，证明的是三件不同的事</text>
  <path d="M72 1278H1008" stroke="#b7bcc2" stroke-width="1" />
  <text x="1008" y="1325" class="source" text-anchor="end">JEV / SYSTEM ONE · RESEARCH EXPLAINER</text>
  
        <g transform="translate(72 286)">
          <rect width="936" height="274" rx="16" fill="#ffffff" stroke="#d4552d" stroke-width="2" filter="url(#soft-shadow)"/>
          <text x="28" y="46" class="h2" style="fill:#d4552d">A · 厂商公开口径</text>
          <text x="28" y="92" class="serif" font-size="74" font-weight="900" style="fill:#d4552d">~194×</text>
          <text x="248" y="88" class="h3" >更快（workflow-style evals）</text>
          <text x="28" y="166" class="serif" font-size="74" font-weight="900" style="fill:#d4552d">~445×</text>
          <text x="248" y="162" class="h3" >更便宜（同一官方评测框架）</text>
          <text x="28" y="226" class="small" >该类倍数强依赖基线模型、任务、网络与批量方式；不能外推到所有场景。</text>
        </g>
        <g transform="translate(72 590)">
          <rect width="936" height="330" rx="16" fill="#ffffff" stroke="#2457c5" stroke-width="2" filter="url(#soft-shadow)"/>
          <text x="28" y="46" class="h2" style="fill:#2457c5">B · 单个第三方测试工具（2026-09-19）</text>
          <text x="28" y="89" class="small" >17 cases / 23 checks</text>
          <g transform="translate(28 122)">
            <text x="0" y="22" class="small" >MODEL</text><text x="310" y="22" class="small" >ACCURACY</text><text x="502" y="22" class="small" >MEDIAN</text><text x="680" y="22" class="small" >COST / CALL</text>
            <path d="M0 38H880" stroke="#b7bcc2" stroke-width="1" />
            <text x="0" y="78" class="h3" >Jev 1.13</text><text x="310" y="78" class="h3" >23 / 23</text><text x="502" y="78" class="h3" >452 ms</text><text x="680" y="78" class="h3" >$0.000016</text>
            <text x="0" y="130" class="body" >GPT-5.6 Terra</text><text x="310" y="130" class="body" >23 / 23</text><text x="502" y="130" class="body" >1,505 ms</text><text x="680" y="130" class="body" >$0.000571</text>
            <text x="0" y="182" class="body" >Claude Opus 5</text><text x="310" y="182" class="body" >23 / 23</text><text x="502" y="182" class="body" >3,394 ms</text><text x="680" y="182" class="body" >$0.003072</text>
          </g>
          <text x="28" y="302" class="small" >仅代表该仓库、该时间、该网络和该小样本；准确率相同，不证明普遍更强。</text>
        </g>
        <g transform="translate(72 956)">
          <text x="0" y="34" class="h2" >C · 真正需要的生产证据</text>
          
  <rect x="0" y="56" width="208" height="42" rx="21" fill="#161b22"/>
  <text x="104" y="85" class="pill" style="fill:#ffffff" text-anchor="middle">你的标注数据</text>

          
  <rect x="220" y="56" width="188" height="42" rx="21" fill="#2457c5"/>
  <text x="314" y="85" class="pill" style="fill:#ffffff" text-anchor="middle">灰度流量</text>

          
  <rect x="420" y="56" width="188" height="42" rx="21" fill="#d4552d"/>
  <text x="514" y="85" class="pill" style="fill:#ffffff" text-anchor="middle">失败样本</text>

          
  <rect x="620" y="56" width="316" height="42" rx="21" fill="#161b22"/>
  <text x="778" y="85" class="pill" style="fill:#ffffff" text-anchor="middle">按风险分层的阈值</text>

          <text x="0" y="144" class="h2" >结论：它值得测试，但“值得测试”与“已经验证”是两句话。</text>
          
  <rect x="0" y="178" width="936" height="54" rx="8" fill="#e9effc"/>
  <rect x="0" y="178" width="6" height="54" rx="3" fill="#2457c5"/>
  <text x="22" y="213" class="note" style="fill:#2457c5">最可信的数字永远来自你的任务、你的用户和你的失败成本。</text>

        </g>
        <text x="72" y="1325" class="source" >资料：[1] TypeSafe AI 官方 benchmark；[3] github.com/souvikr/jev-test（单次公开测试）。</text>
      
</svg>