
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <title>Jev 三个决策原语信息图</title>
  <desc>用 Choice、Score 与 Noul 解释 Jev 如何把模糊判断变成程序可执行的结构。</desc>
  <defs>
    <pattern id="grain" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M0 79.5H80M79.5 0V80" stroke="#87928b" stroke-opacity=".09"/>
      <circle cx="11" cy="17" r="1" fill="#6c756e" opacity=".12"/>
      <circle cx="58" cy="46" r=".8" fill="#a16948" opacity=".11"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#3a332b" flood-opacity=".10"/>
    </filter>
    <style>
      .cn{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;fill:#26332f}
      .serif{font-family:"SimSun","Noto Serif SC",serif;fill:#26332f}
      .code{font-family:Consolas,"SFMono-Regular",monospace;font-size:22px;fill:#31423d}
      .label{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:23px;font-weight:700;fill:#26332f}
      .small{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:20px;fill:#52605b}
    </style>
  </defs>

  <rect width="1080" height="1920" fill="#f4efe3"/>
  <rect width="1080" height="1920" fill="url(#grain)"/>
  <path d="M106 152 C235 126 366 162 494 142 S756 127 971 150" fill="none" stroke="#315e5e" stroke-width="4" opacity=".65"/>
  <circle cx="102" cy="150" r="8" fill="#c97b53"/>
  <circle cx="976" cy="150" r="8" fill="#77978d"/>

  <text x="540" y="265" text-anchor="middle" class="serif" font-size="76" font-weight="800">Jev 到底在做什么？</text>
  <text x="540" y="329" text-anchor="middle" class="cn" font-size="34" font-weight="600" fill="#48635e">它不写长答案，而是返回程序能直接使用的判断</text>

  <g transform="translate(80 405)" filter="url(#shadow)">
    <rect width="286" height="900" rx="20" fill="#fbf8ef" stroke="#2f3c38" stroke-width="3"/>
    <path d="M0 66 Q10 40 34 42 H252 Q278 42 286 66 V142 H0Z" fill="#d79569" opacity=".92"/>
    <text x="143" y="100" text-anchor="middle" class="cn" font-size="34" font-weight="800" fill="#fffaf0">Choice｜选项</text>
    <text x="143" y="133" text-anchor="middle" class="cn" font-size="18" fill="#fffaf0">从候选项中做选择</text>
    <rect x="24" y="172" width="238" height="242" rx="13" fill="#eef1e9" stroke="#66736d" stroke-width="2"/>
    <text x="43" y="207" class="code" font-weight="700">JSON</text>
    <text x="43" y="242" class="code">{</text><text x="43" y="269" class="code">  &quot;choice&quot;: {</text><text x="43" y="296" class="code">    &quot;type&quot;: &quot;string&quot;,</text><text x="43" y="323" class="code">    &quot;enum&quot;: [...]</text><text x="43" y="350" class="code">  }</text><text x="43" y="377" class="code">}</text>
    <text x="28" y="469" class="label">输出：概率分布</text>
    <text x="28" y="501" class="small">不是只给一个答案</text>
    <text x="28" y="568" class="small">工具 A</text>
    <rect x="98" y="543" width="150" height="27" rx="13" fill="#e4ded1"/>
    <rect x="98" y="543" width="105" height="27" rx="13" fill="#cf7f58"/>
    <text x="28" y="635" class="small">工具 B</text>
    <rect x="98" y="610" width="150" height="27" rx="13" fill="#e4ded1"/>
    <rect x="98" y="610" width="54" height="27" rx="13" fill="#86a198"/>
    <text x="28" y="702" class="small">转人工</text>
    <rect x="98" y="677" width="150" height="27" rx="13" fill="#e4ded1"/>
    <rect x="98" y="677" width="25" height="27" rx="13" fill="#b8aa8f"/>
    <path d="M37 775 C83 747 199 747 248 775" fill="none" stroke="#315e5e" stroke-width="3" stroke-dasharray="7 8"/>
    <text x="143" y="825" text-anchor="middle" class="cn" font-size="26" font-weight="700">适合：模型路由</text>
    <text x="143" y="862" text-anchor="middle" class="small">“下一步该选哪个？”</text>
  </g>

  <g transform="translate(397 405)" filter="url(#shadow)">
    <rect width="286" height="900" rx="20" fill="#fbf8ef" stroke="#2f3c38" stroke-width="3"/>
    <path d="M0 66 Q10 40 34 42 H252 Q278 42 286 66 V142 H0Z" fill="#73978e" opacity=".95"/>
    <text x="143" y="100" text-anchor="middle" class="cn" font-size="34" font-weight="800" fill="#fffaf0">Score｜评分</text>
    <text x="143" y="133" text-anchor="middle" class="cn" font-size="18" fill="#fffaf0">返回一个区间分数</text>
    <rect x="24" y="172" width="238" height="242" rx="13" fill="#eef1e9" stroke="#66736d" stroke-width="2"/>
    <text x="43" y="207" class="code" font-weight="700">JSON</text>
    <text x="43" y="242" class="code">{</text><text x="43" y="269" class="code">  &quot;score&quot;: {</text><text x="43" y="296" class="code">    &quot;type&quot;: &quot;number&quot;,</text><text x="43" y="323" class="code">    &quot;min&quot;: 0,</text><text x="43" y="350" class="code">    &quot;max&quot;: 10</text><text x="43" y="377" class="code">  }</text><text x="43" y="404" class="code">}</text>
    <text x="28" y="469" class="label">输出：评分与置信度</text>
    <text x="28" y="501" class="small">阈值由业务自己决定</text>
    <path d="M38 609 H248" stroke="#33423d" stroke-width="4" stroke-linecap="round"/>
    <g stroke="#33423d" stroke-width="2">
      <path d="M38 594V624M80 598V620M122 594V624M164 598V620M206 594V624M248 598V620"/>
    </g>
    <g class="small" text-anchor="middle">
      <text x="38" y="660">0</text><text x="80" y="660">2</text><text x="122" y="660">4</text>
      <text x="164" y="660">6</text><text x="206" y="660">8</text><text x="248" y="660">10</text>
    </g>
    <circle cx="185" cy="609" r="17" fill="#f4efe3" stroke="#c96f48" stroke-width="6"/>
    <path d="M185 588 V550" stroke="#c96f48" stroke-width="3"/>
    <rect x="151" y="514" width="68" height="36" rx="18" fill="#c96f48"/>
    <text x="185" y="540" text-anchor="middle" class="cn" font-size="20" font-weight="800" fill="#fff">示意</text>
    <path d="M37 775 C83 747 199 747 248 775" fill="none" stroke="#315e5e" stroke-width="3" stroke-dasharray="7 8"/>
    <text x="143" y="825" text-anchor="middle" class="cn" font-size="26" font-weight="700">适合：风险分级</text>
    <text x="143" y="862" text-anchor="middle" class="small">“这件事有多紧急？”</text>
  </g>

  <g transform="translate(714 405)" filter="url(#shadow)">
    <rect width="286" height="900" rx="20" fill="#fbf8ef" stroke="#2f3c38" stroke-width="3"/>
    <path d="M0 66 Q10 40 34 42 H252 Q278 42 286 66 V142 H0Z" fill="#bd684e" opacity=".92"/>
    <text x="143" y="100" text-anchor="middle" class="cn" font-size="34" font-weight="800" fill="#fffaf0">Noul｜布尔</text>
    <text x="143" y="133" text-anchor="middle" class="cn" font-size="18" fill="#fffaf0">返回“是”的概率</text>
    <rect x="24" y="172" width="238" height="242" rx="13" fill="#eef1e9" stroke="#66736d" stroke-width="2"/>
    <text x="43" y="207" class="code" font-weight="700">JSON</text>
    <text x="43" y="242" class="code">{</text><text x="43" y="269" class="code">  &quot;noul&quot;: {</text><text x="43" y="296" class="code">    &quot;type&quot;: &quot;number&quot;,</text><text x="43" y="323" class="code">    &quot;min&quot;: 0,</text><text x="43" y="350" class="code">    &quot;max&quot;: 1</text><text x="43" y="377" class="code">  }</text><text x="43" y="404" class="code">}</text>
    <text x="28" y="469" class="label">输出：为真概率</text>
    <text x="28" y="501" class="small">0 和 1 之间连续表达</text>
    <path d="M54 674 A96 96 0 0 1 246 674" fill="none" stroke="#d8d7c9" stroke-width="28" stroke-linecap="round"/>
    <path d="M54 674 A96 96 0 0 1 164 581" fill="none" stroke="#7fa096" stroke-width="28" stroke-linecap="round"/>
    <path d="M164 581 A96 96 0 0 1 246 674" fill="none" stroke="#d49a6a" stroke-width="28" stroke-linecap="round"/>
    <path d="M150 674 L211 617" stroke="#b7583f" stroke-width="8" stroke-linecap="round"/>
    <circle cx="150" cy="674" r="15" fill="#f4efe3" stroke="#b7583f" stroke-width="6"/>
    <text x="54" y="716" class="small">否</text><text x="228" y="716" class="small">是</text>
    <path d="M37 775 C83 747 199 747 248 775" fill="none" stroke="#315e5e" stroke-width="3" stroke-dasharray="7 8"/>
    <text x="143" y="825" text-anchor="middle" class="cn" font-size="26" font-weight="700">适合：升级判断</text>
    <text x="143" y="862" text-anchor="middle" class="small">“要不要转给人工？”</text>
  </g>

  <g transform="translate(80 1360)" filter="url(#shadow)">
    <rect width="920" height="340" rx="24" fill="#fbf8ef" stroke="#2f3c38" stroke-width="3"/>
    <rect x="30" y="34" width="260" height="62" rx="31" fill="#315e5e"/>
    <text x="160" y="76" text-anchor="middle" class="cn" font-size="29" font-weight="800" fill="#fffaf0">统一返回结构</text>
    <rect x="326" y="34" width="558" height="62" rx="12" fill="#e9e5d8" stroke="#87928b" stroke-width="2"/>
    <text x="605" y="76" text-anchor="middle" class="code" font-size="26">{ choice, score, noul, confidence }</text>

    <g transform="translate(53 158)">
      <rect width="176" height="76" rx="16" fill="#e8c1a5" stroke="#9b6244" stroke-width="2"/>
      <text x="88" y="48" text-anchor="middle" class="cn" font-size="25" font-weight="700">用户输入</text>
      <path d="M195 38H278" stroke="#315e5e" stroke-width="5" stroke-linecap="round"/>
      <path d="M266 26L280 38L266 50" fill="none" stroke="#315e5e" stroke-width="5"/>
      <rect x="298" width="176" height="76" rx="16" fill="#c6d7d0" stroke="#55786f" stroke-width="2"/>
      <text x="386" y="48" text-anchor="middle" class="cn" font-size="25" font-weight="700">结构化判断</text>
      <path d="M493 38H576" stroke="#315e5e" stroke-width="5" stroke-linecap="round"/>
      <path d="M564 26L578 38L564 50" fill="none" stroke="#315e5e" stroke-width="5"/>
      <rect x="596" width="218" height="76" rx="16" fill="#e6ddbd" stroke="#8e8053" stroke-width="2"/>
      <text x="705" y="48" text-anchor="middle" class="cn" font-size="25" font-weight="700">代码决定下一步</text>
    </g>
    <text x="460" y="285" text-anchor="middle" class="cn" font-size="25" fill="#52605b">核心变化：AI 不只“会说话”，还要能给软件稳定、可检查的决策接口</text>
  </g>

  <text x="540" y="1791" text-anchor="middle" class="cn" font-size="29" font-weight="700" fill="#315e5e">类型正确 ≠ 判断正确，上线仍需阈值、实测和人工兜底</text>
  <text x="540" y="1842" text-anchor="middle" class="cn" font-size="19" fill="#69756f">依据 TypeSafe AI 官方介绍整理；图中刻度仅为结构示意，不代表真实性能数据</text>
</svg>